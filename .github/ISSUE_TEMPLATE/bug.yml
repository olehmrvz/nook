name: Bug
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. A screenshot helps a lot (no personal data, please).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nook version
      description: ⚙︎ → Updates → "version 1.…"
      placeholder: "1.15"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS
      placeholder: "MacBook Air M2, macOS 15.5"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Agents, Music, Clipboard, Shelf, Notifications, Volume and brightness, Updates, Other]
